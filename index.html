<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFFLINE — Special Tools App Ninove</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Courier New', Courier, monospace;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .panel {
    border: 1px solid rgba(0, 255, 70, 0.25);
    background: rgba(0, 0, 0, 0.72);
    padding: 52px 64px;
    text-align: center;
    position: relative;
    backdrop-filter: blur(2px);
  }

  .panel::before,
  .panel::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border-color: #00ff46;
    border-style: solid;
  }
  .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .corner-tl,
  .corner-br {
    position: absolute;
    width: 18px; height: 18px;
    border-color: #00ff46;
    border-style: solid;
  }
  .corner-tl { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-br { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }

  .tag {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(0, 255, 70, 0.4);
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .main-title {
    font-size: clamp(52px, 10vw, 96px);
    font-weight: 900;
    color: #00ff46;
    letter-spacing: 12px;
    text-shadow:
      0 0 20px rgba(0, 255, 70, 0.9),
      0 0 60px rgba(0, 255, 70, 0.4),
      0 0 120px rgba(0, 255, 70, 0.15);
    line-height: 1;
    margin-bottom: 24px;
    animation: flicker 6s infinite;
  }

  @keyframes flicker {
    0%, 94%, 96%, 98%, 100% { opacity: 1; }
    95%, 97%                 { opacity: 0.85; }
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(0,255,70,0.4), transparent);
    margin: 20px 0;
  }

  .subtitle {
    font-size: 18px;
    letter-spacing: 6px;
    color: rgba(0, 255, 70, 0.75);
    text-transform: uppercase;
    margin-bottom: 10px;
    line-height: 2;
  }

  .meta {
    display: flex;
    gap: 40px;
    justify-content: center;
    margin-top: 28px;
  }

  .meta-item {
    text-align: center;
  }

  .meta-label {
    font-size: 14px;
    letter-spacing: 3px;
    color: rgba(0, 255, 70, 0.3);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .meta-value {
    font-size: 16px;
    letter-spacing: 2px;
    color: rgba(0, 255, 70, 0.6);
  }

  .exit {
    margin-top: 32px;
    font-size: 16px;
    letter-spacing: 4px;
    color: rgba(0, 255, 70, 0.35);
  }

  .exit span {
    color: rgba(0, 255, 70, 0.7);
  }

  .scanline {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.04) 3px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="scanline"></div>

<div class="overlay">
  <div class="panel">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="tag">Special Tools App Ninove</div>
    <div class="main-title">OFFLINE</div>
    <div class="divider"></div>
    <div class="subtitle">Initiatief is stopgezet</div>
    <div class="meta">
      <div class="meta-item">
        <div class="meta-label">Datum</div>
        <div class="meta-value">MEI 2026</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Status</div>
        <div class="meta-value">TERMINATED</div>
      </div>
    </div>
    <div class="exit">EXIT CODE : <span>0</span></div>
  </div>
</div>

<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&';

  let W, H, cols, drops;
  const fontSize = 14;

  function init() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cols = Math.floor(W / fontSize);
    drops = Array.from({ length: cols }, () => Math.random() * -100);
  }

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.045)';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < cols; i++) {
      const y = drops[i] * fontSize;

      const brightness = Math.random();
      if (brightness > 0.97) {
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00ff46';
      } else if (brightness > 0.93) {
        ctx.fillStyle = '#aaffbb';
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#00ff46';
      } else {
        const alpha = 0.15 + Math.random() * 0.65;
        ctx.fillStyle = `rgba(0, ${Math.floor(180 + Math.random()*75)}, ${Math.floor(40 + Math.random()*30)}, ${alpha})`;
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
      }

      ctx.font = `${fontSize}px 'Courier New', monospace`;
      const char = CHARS[Math.floor(Math.random() * CHARS.length)];
      ctx.fillText(char, i * fontSize, y);

      if (y > H && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i] += 0.5 + Math.random() * 0.5;
    }
  }

  init();
  window.addEventListener('resize', init);
  setInterval(draw, 40);
</script>
</body>
</html>
